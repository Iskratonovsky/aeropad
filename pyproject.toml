[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aeropad"
version = "0.6.2"
description = "AEROnautical Preliminary & conceptual Aircraft Design toolkit — full-range aerodynamic polar reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ed" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
symbolic = ["pysr>=0.18"]

[project.scripts]
aeropad-gui = "aeropad.gui.app:main"

[tool.setuptools.packages.find]
include = ["aeropad*"]

[tool.setuptools.package-data]
aeropad = ["gui/assets/*"]
